MODEL:
  PRETRAIN_PATH_T: '../../ViT-B-16.pt'
  TRANSFORMER_TYPE: 'ViT-B-16'
  STRIDE_SIZE: [ 16, 16 ]
  SIE_CAMERA: True
  DIRECT: 1
  SIE_COE: 1.0
  ID_LOSS_WEIGHT: 0.25
  TRIPLET_LOSS_WEIGHT: 1.0
  FROZEN: True

INPUT:
  SIZE_TRAIN: [ 256, 128 ]
  SIZE_TEST: [ 256, 128 ]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8 # or 14

DATASETS:
  NAMES: ('market1501MM')
  ROOT_DIR: '../../'

SOLVER:
  BASE_LR: 0.0003
  WARMUP_ITERS: 10
  MAX_EPOCHS: 120
  OPTIMIZER_NAME: 'AdamW'
  GAMMA: 0.1
  IMS_PER_BATCH: 128

TEST:
  IMS_PER_BATCH: 128
  RE_RANKING: 'no'
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  MISS: "nothing"

OUTPUT_DIR: '..'


